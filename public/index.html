<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업제국 ONLINE</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        /* 기본 테마 설정 */
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        
        /* 전체 화면 스크롤 절대 방지 및 높이 고정 */
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); line-height: 1.3; font-size: 14px; }

        /* 로그인 스크린 */
        #loginScreen {
            display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); position: absolute; z-index: 100;
        }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 35px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 380px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .login-card h1 { color: var(--accent-gold); font-size: 1.8rem; margin-bottom: 8px; letter-spacing: 1px; }
        .login-card p { color: var(--text-sub); margin-bottom: 20px; font-size: 0.9rem; }
        .input-group { margin-bottom: 12px; }
        .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: white; font-size: 0.95rem; outline: none; margin-bottom: 8px; }
        .input-group input:focus { border-color: var(--accent-blue); }
        .btn { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent-blue); color: white; margin-bottom: 12px; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); }
        .btn-secondary:hover { background: rgba(59, 130, 246, 0.1); }
        .divider { color: var(--text-sub); margin: 12px 0; font-size: 0.8rem; }

        /* 인게임 헤더 (높이 최소화 압축) */
        header { background: var(--panel-bg); padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .header-left h1 { font-size: 1.15rem; color: var(--accent-gold); }
        .header-right { display: flex; gap: 10px; font-size: 0.9rem; align-items: center; }
        .info-badge { background: #0f172a; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border-color); }
        .time-badge { color: var(--accent-red); font-weight: bold; border-color: var(--accent-red); }

        /* 게임 메인 컨테이너 레이아웃 */
        .game-container { flex: 1; min-height: 0; display: grid; grid-template-columns: 4.2fr 5.8fr; gap: 12px; width: 100%; max-width: 1600px; margin: 0 auto; padding: 10px 15px; height: calc(100vh - 45px); }
        
        .left-col, .right-col { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; overflow: hidden; }
        
        /* 패널 타이틀 및 여백 초압축 */
        .panel { background: var(--panel-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
        .panel-title { font-size: 0.95rem; color: var(--accent-blue); border-bottom: 2px solid var(--border-color); padding-bottom: 4px; margin-bottom: 2px; font-weight: 600; flex-shrink: 0; }

        /* 좌측: 내 기업 현황 다이어트 */
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 3px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .stat-label { color: var(--text-sub); display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
        .stat-val { font-size: 0.95rem; font-weight: bold; }
        .cash-box { background: rgba(16, 185, 129, 0.08); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.15); text-align: right; margin-bottom: 2px; }
        .cash-val { font-size: 1.25rem; color: var(--accent-green); font-weight: bold; line-height: 1.1; }
        .cash-flow { font-size: 0.85rem; color: var(--accent-red); margin-top: 1px; }

        /* 좌측: 터미널 로그 공간 확보 */
        .log-panel { flex: 1; min-height: 0; }
        .terminal { flex: 1; min-height: 0; overflow-y: auto; background: #0b1120; border-radius: 6px; padding: 8px; border: 1px solid var(--border-color); font-family: 'Pretendard', monospace; font-size: 0.9rem; }
        .log-item { line-height: 1.4; border-bottom: 1px dashed rgba(255,255,255,0.05); padding: 4px 0; color: #cbd5e1; }
        .log-item:first-child { color: white; font-weight: bold; }

        /* 우측: 시가총액 순위 슬림화 */
        .rank-list { display: flex; flex-direction: column; gap: 4px; }
        .rank-item { display: flex; justify-content: space-between; background: #0f172a; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--border-color); font-size: 0.9rem; }
        .rank-1 { border-color: var(--accent-gold); }
        .rank-share { color: var(--accent-gold); font-size: 0.8rem; margin-left: 6px; }

        .players-container { display: flex; flex-wrap: wrap; gap: 6px; }
        .player-chip { background: #0f172a; border: 1px solid var(--border-color); padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; }

        /* 우측: 경영 전략 버튼 초슬림 패치 (핵심!) */
        .action-panel { flex: 1; min-height: 0; }
        .action-list { display: flex; flex-direction: column; gap: 5px; height: 100%; }
        .action-btn { 
            display: flex; justify-content: space-between; align-items: center; background: #0f172a; 
            border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 5px; 
            color: white; cursor: pointer; transition: 0.1s; text-align: left; flex: 1; min-height: 0;
        }
        .action-btn:hover:not(:disabled) { background: #1e293b; border-color: var(--accent-blue); }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .act-title { font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .act-desc { color: var(--text-sub); font-size: 0.8rem; }

        /* 글로벌 경제 속보창 최소화 */
        .news-banner { flex-shrink: 0; background: rgba(245, 158, 11, 0.08); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); padding: 6px; border-radius: 5px; font-weight: bold; text-align: center; font-size: 0.85rem; }

    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card">
            <h1>CORPORATE EMPIRE</h1>
            <p>글로벌 경제 패권 전쟁에 오신 것을 환영합니다</p>
            <div class="input-group">
                <input type="text" id="nickname" placeholder="CEO 닉네임 입력 (예: 워렌버핏)" autocomplete="off">
                <button id="createRoomBtn" class="btn btn-primary">새로운 서버 개설하기</button>
            </div>
            <div class="divider">OR</div>
            <div class="input-group">
                <input type="text" id="roomCode" placeholder="입장할 방 코드 입력" autocomplete="off">
                <button id="joinRoomBtn" class="btn btn-secondary">기존 서버 접속하기</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" style="display:none;">
        <header>
            <div class="header-left">
                <h1>🏢 기업제국 ONLINE</h1>
            </div>
            <div class="header-right">
                <div class="info-badge">서버: <strong id="roomCodeDisplay" style="color:var(--accent-blue);">-</strong></div>
                <div class="info-badge" style="color:var(--text-sub);">남은 시장 점유율: <strong id="npcShareDisplay" style="color:white;">-</strong>%</div>
                <div class="info-badge time-badge">남은 시간: <span id="timerDisplay">300</span>초</div>
                <button id="readyBtn" class="btn btn-primary" style="padding: 4px 12px; margin: 0; width: auto; font-size: 0.85rem;">준비 완료</button>
            </div>
        </header>

        <div class="game-container">
            <div class="left-col">
                <div class="panel">
                    <div class="panel-title">내 기업 현황</div>
                    <div id="myCompany">
                        <div style="color:var(--text-sub); text-align:center; padding: 10px;">서버 연결 대기 중...</div>
                    </div>
                </div>

                <div class="panel log-panel">
                    <div class="panel-title">터미널 로그</div>
                    <div id="logList" class="terminal"></div>
                </div>
            </div>

            <div class="right-col">
                
                <div class="panel">
                    <div class="panel-title">🏆 실시간 시가총액 순위</div>
                    <div id="rankingList" class="rank-list"></div>
                </div>

                <div class="panel">
                    <div class="panel-title">🤝 현재 접속중인 CEO (경쟁 기업)</div>
                    <div id="playersList" class="players-container"></div>
                </div>

                <div class="panel action-panel">
                    <div class="panel-title">⚡ 경영 전략 실행 (턴당 1회)</div>
                    <div class="action-list">
                        <button id="advertiseBtn" class="action-btn">
                            <span class="act-title">📺 마케팅 <span class="cost" style="color:var(--accent-red); font-size:0.8rem;">(계산중)</span></span>
                            <span class="act-desc">브랜드+3, 점유율+1%</span>
                        </button>
                        <button id="hireBtn" class="action-btn">
                            <span class="act-title">👨 인재 영입 <span class="cost" style="color:var(--accent-red); font-size:0.8rem;">(계산중)</span></span>
                            <span class="act-desc">직원 +5명명</span>
                        </button>
                        <button id="researchBtn" class="action-btn">
                            <span class="act-title">🧪 R&D 투자 <span class="cost" style="color:var(--accent-red); font-size:0.8rem;">(1,000만)</span></span>
                            <span class="act-desc">70% 성공시 점유율+2%</span>
                        </button>
                        <button id="foreignBtn" class="action-btn">
                            <span class="act-title">🌎 해외 진출 <span class="cost" style="color:var(--accent-red); font-size:0.8rem;">(3,000만)</span></span>
                            <span class="act-desc">브랜드 비례 확률 성공시 대박</span>
                        </button>
                        <button id="loanBtn" class="action-btn">
                            <span class="act-title">🏦 자금 조달</span>
                            <span class="act-desc">현금+5천만 (이자 4%)</span>
                        </button>
                        <button id="paybackBtn" class="action-btn">
                            <span class="act-title">💸 부채 상환 <span class="cost" style="color:var(--accent-red); font-size:0.8rem;">(5,000만)</span></span>
                            <span class="act-desc">부채 및 이자 탕감</span>
                        </button>
                        <button id="ipoBtn" class="action-btn">
                            <span class="act-title">📈 IPO 상장</span>
                            <span class="act-desc">가치 3억↑ 1회 (자본+1억)</span>
                        </button>
                    </div>
                </div>

                <div id="newsBox" class="news-banner">글로벌 경제 속보 수신 대기 중...</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
